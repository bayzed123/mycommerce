name: Ensure R2 media bucket exists

# One-off utility: checks whether the given R2 bucket exists in the
# Cloudflare account behind CLOUDFLARE_SA3_API, and creates it if not.
# R2 is S3-API compatible, so the plain AWS CLI works against it as
# long as --endpoint-url points at R2 instead of AWS.
#
# Never touches any other Cloudflare resource (Workers, Pages, other
# buckets) - this only calls head-bucket/create-bucket for the one
# bucket name given as input.

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: "R2 bucket to check/create"
        required: true
        default: "mycommerce-media"

permissions:
  contents: read

jobs:
  ensure-bucket:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUD_FLARE_ACCES_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_FLARE_ACCES_SECRET_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.CLOUDFLARE_SA3_API }}
    steps:
      # R2 only supports path-style addressing (endpoint/bucket), not AWS's
      # default virtual-hosted-style (bucket.endpoint) - without this, the
      # AWS CLI tries to resolve a hostname R2 has no certificate for and
      # fails with an SSL handshake error before even reaching R2.
      - name: Configure AWS CLI for path-style S3 addressing
        run: aws configure set default.s3.addressing_style path

      - name: Check for existing bucket
        id: check
        run: |
          if aws s3api head-bucket --bucket "${{ inputs.bucket_name }}" --endpoint-url "$R2_ENDPOINT" 2>/tmp/head-bucket.err; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Bucket '${{ inputs.bucket_name }}' already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "head-bucket said it does not exist (or isn't visible to this token):"
            cat /tmp/head-bucket.err
          fi

      - name: Create bucket if missing
        if: steps.check.outputs.exists == 'false'
        run: |
          aws s3api create-bucket --bucket "${{ inputs.bucket_name }}" --endpoint-url "$R2_ENDPOINT"
          echo "Created bucket '${{ inputs.bucket_name }}'."

      - name: List bucket contents (sanity check)
        run: |
          aws s3api list-objects-v2 --bucket "${{ inputs.bucket_name }}" --endpoint-url "$R2_ENDPOINT" --max-items 5 || true
