name: Shop API

on:
  push:
    branches:
      - main
    paths:
      - "services/shopapi/**"
      - ".github/workflows/shopapi.yml"
  pull_request:
    branches:
      - main
    paths:
      - "services/shopapi/**"
      - ".github/workflows/shopapi.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/shopapi
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mystore
          POSTGRES_USER: mystore
          POSTGRES_PASSWORD: mystore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-secret-key"
      DB_NAME: mystore
      DB_USER: mystore
      DB_PASSWORD: mystore
      DB_HOST: localhost
      REDIS_HOST: localhost
      REDIS_PASSWORD: ""
      RABBITMQ_HOST: localhost
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      STRIPE_TEST_SECRET_KEY: "sk_test_ci_placeholder"
      STRIPE_PRODUCTION_SECRET_KEY: ""
      PY_UTILITIES_JWT_ISSUER: "shopapi"
      PY_UTILITIES_JWT_SECRET: "ci-jwt-secret"
      VAT_PERCENTAGE: "20"
      USE_S3: "False"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Django system check
        run: uv run python manage.py check

      # accounts/tests/test_accounts_tasks.py sets stripe.api_key straight
      # from STRIPE_TEST_SECRET_KEY and calls the real Stripe API to create
      # customers, which CI's placeholder key can't do. It needs real
      # test-mode Stripe credentials to run meaningfully, so it's excluded
      # here rather than asserted against a guaranteed-failing environment.
      - name: Run tests
        run: uv run pytest --ignore=accounts/tests/test_accounts_tasks.py

  build-image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t mycommerce-shopapi services/shopapi
