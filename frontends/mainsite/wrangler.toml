name = "mycommerce-storefront"
main = "./.output/server/index.mjs"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]

# Static build output (JS chunks, images, fonts, etc.) served straight
# from the edge instead of round-tripping through the Worker.
[assets]
directory = "./.output/public"
binding = "ASSETS"

# All NUXT_PUBLIC_* / Firebase / Stripe values are baked in at build time
# by the deploy workflow (.github/workflows/mainsite-worker.yml), the same
# way the Nuxt build already reads them via `process.env.*` in
# nuxt.config.ts. There is nothing secret to declare here: this Worker
# only ever holds already-public client-side values (a Stripe
# *publishable* key, a Firebase *client* config - both meant to ship in
# browser JS - and public backend URLs).
