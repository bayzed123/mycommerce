# Development/self-hosting stack for the services that actually exist in this
# checkout: services/shopapi, services/cartapi, services/gopurchase, plus the
# infrastructure they depend on (PostgreSQL, Redis, RabbitMQ).
#
# This replaces an older Compose file that referenced directories which no
# longer exist in this repository (services/mystore, services/mycart,
# services/myreviews, services/subscribers, services/goauthentication).
#
# Usage:
#   1. cp services/shopapi/.env.example services/shopapi/.env
#      cp services/cartapi/.env.example services/cartapi/.env
#      cp services/gopurchase/.env.example services/gopurchase/.env
#      Fill in real values (SECRET_KEY, JWT secrets, Stripe keys, etc). Never
#      commit these .env files.
#   2. docker compose up --build
#
# The Nuxt frontends are not included here: run them separately with
# `pnpm dev` (frontends/mainsite, frontends/admin, frontends/mobile) against
# these services, or deploy them to Cloudflare Pages/Workers.

services:
  postgres:
    image: postgres:16-alpine
    container_name: mycommerce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_MULTIPLE_DATABASES: "mystore,mycart"
      POSTGRES_USER: ${POSTGRES_USER:-mycommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mycommerce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mycommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mycommerce

  redis:
    image: redis:7-alpine
    container_name: mycommerce_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mycommerce

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mycommerce_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mycommerce

  shopapi:
    build: ./services/shopapi
    container_name: mycommerce_shopapi
    restart: unless-stopped
    env_file:
      - ./services/shopapi/.env
    environment:
      DB_HOST: postgres
      DB_NAME: mystore
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    volumes:
      - shopapi_media:/app/media
      - shopapi_static:/app/static
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mycommerce

  shopapi_celery:
    build: ./services/shopapi
    container_name: mycommerce_shopapi_celery
    restart: unless-stopped
    command: celery -A shopapi.celery_app worker -E --loglevel=info
    env_file:
      - ./services/shopapi/.env
    environment:
      DB_HOST: postgres
      DB_NAME: mystore
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - shopapi
    networks:
      - mycommerce

  cartapi:
    build: ./services/cartapi
    container_name: mycommerce_cartapi
    restart: unless-stopped
    env_file:
      - ./services/cartapi/.env
    environment:
      DB_HOST: postgres
      DB_NAME: mycart
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    volumes:
      - cartapi_static:/app/static
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mycommerce

  cartapi_celery:
    build: ./services/cartapi
    container_name: mycommerce_cartapi_celery
    restart: unless-stopped
    command: celery -A cartapi.celery_app worker -E --loglevel=info
    env_file:
      - ./services/cartapi/.env
    environment:
      DB_HOST: postgres
      DB_NAME: mycart
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - cartapi
    networks:
      - mycommerce

  gopurchase:
    build: ./services/gopurchase
    container_name: mycommerce_gopurchase
    restart: unless-stopped
    env_file:
      - ./services/gopurchase/.env
    environment:
      PORT: "9000"
      REDIS_ADDRESS: redis:6379
    ports:
      - "9000:9000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mycommerce

volumes:
  postgres_data:
  shopapi_media:
  shopapi_static:
  cartapi_static:

networks:
  mycommerce:
    driver: bridge
